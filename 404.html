<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // Redirects GitHub Pages 404s to ccsuclubs.github.io while preserving path and query/hash
    var targetDomain = "https://gaynormccown.pages.dev";
    var pathSegmentsToKeep = 0; // Adjust if your site is hosted in a subdirectory (e.g., /repo-name/ would be 1)

    var l = window.location;
    var pathSegments = l.pathname.split('/').slice(1);
    
    // Build the redirect URL
    var redirectUrl = targetDomain + '/' + pathSegments.slice(pathSegmentsToKeep).join('/') + l.search + l.hash;
    
    // Perform the redirect
    window.location.replace(redirectUrl);
  </script>
</head>
</html>
